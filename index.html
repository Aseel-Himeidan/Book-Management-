<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Be Read List</title>
     <!--Bootstrap library linik-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!--External CSS link-->
    <link  href="style.css" rel="stylesheet">
   
   
</head>
<body>
   <!-- Code to customise form layout using bootstrap classes -->
<div class="container">
    <h1 class="Title"> To Be Read List</h1>
    <div class="mb-5">
        <div class="row">
            <div class=" form-group col-md-6 mb-3">
                <label for="name">Name</label>
                <input 
                    type="text"
                    name="title"
                    class="form-control"
                    id="title"
                    placeholder="Enter Book Title"
                >
            </div>
            <div class=" form-group col-md-6 mb-3">
                <label for="author">Author</label>
                <input 
                    type="text"
                    name="author"
                    class="form-control"
                    id="author"
                    placeholder="Enter Book Author"
                >
            </div>
            <div class=" form-group col-md-6 mb-3">
                <label for="year">Publication year</label>
                <input 
                    type="number"
                    name="year"
                    class="form-control"
                    id="year"
                    placeholder="Enter Publication Year"
                >
            </div>
            <div class=" form-group col-md-6 mb-3">
                <label for="genre">Genre</label>
                <input 
                    type="text"
                    name="genre"
                    class="form-control"
                    id="genre"
                    placeholder="Enter Genre Type"
                >
            </div>
        </div>
        <div class="col-lg-12 mt-5">
            <button class="btn btn-success" id="Submit" onclick="AddData()"> Add Book To List </button>
            <button class="btn btn-primary" id="Update"> Update List </button>
        </div>
    </div>
    <div class="row mt-5">
        <div class="col-12">
            <table class="table table-bordered" id="crudTable">
                <thead>
                    <tr>
                        <th> Title </th> 
                        <th> Author  </th> 
                        <th> Genre </th> 
                        <th> Publication Year </th> 
                   </tr>
                </thead>
                <tbody>

                </tbody>
            </table>
        </div>
    </div>
</div>
<!--Externaljavascript link-->
    <script src="script.js"></script>
</body>
</html>
